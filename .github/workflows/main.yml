name: Automated QA Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil Kode dari Repository
      uses: actions/checkout@v4

    - name: Menyiapkan Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Menginstal Library yang Dibutuhkan
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html requests playwright
        playwright install chromium

    - name: Menjalankan Pengujian Pytest
      run: pytest --html=report.html --self-contained-html
      
    - name: Menyimpan Laporan HTML (Artifact)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Laporan-QA
        path: report.html
